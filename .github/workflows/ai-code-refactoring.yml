name: AI Code Refactoring & Optimization

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    outputs:
      files_to_analyze: ${{ steps.analyze.outputs.files }}
      quality_score: ${{ steps.analyze.outputs.score }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changed files
        id: analyze
        run: |
          # Get changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(gh pr view ${{ github.event.number }} --json files --jq '.files[].path' | grep -E '\.(java|py|js|ts)$' | head -10)
          else
            CHANGED_FILES=$(find . -name "*.java" -type f | head -10)
          fi

          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

          # Calculate basic quality score
          if [ -n "$CHANGED_FILES" ]; then
            TOTAL_FILES=$(echo "$CHANGED_FILES" | wc -l)
            echo "score=$TOTAL_FILES" >> $GITHUB_OUTPUT
          else
            echo "score=0" >> $GITHUB_OUTPUT
          fi

  ai-code-refactoring:
    needs: analyze-code-quality
    runs-on: ubuntu-latest
    if: needs.analyze-code-quality.outputs.quality_score != '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for analysis
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install analysis dependencies
        run: |
          pip install openai anthropic requests radon pylint flake8

      - name: Analyze code for refactoring opportunities
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import os
          import json
          import subprocess
          from pathlib import Path
          import re

          def get_ai_refactoring_suggestions(code_content, file_path, model='gpt-4'):
              prompt = f'''Analyze the following code for refactoring opportunities:

          File: {file_path}

          Code:
          ```java
          {code_content}
          ```

          Please provide specific refactoring suggestions including:
          1. Code smells or anti-patterns identified
          2. Suggested improvements with code examples
          3. Performance optimizations
          4. Best practices violations
          5. Maintainability improvements

          Focus on:
          - Method complexity reduction
          - Duplicate code elimination
          - Better separation of concerns
          - Improved naming conventions
          - Design pattern applications
          - Performance bottlenecks

          Format your response as JSON with the following structure:
          {{
            \"issues\": [
              {{
                \"type\": \"code_smell|performance|maintainability|best_practice\",
                \"severity\": \"low|medium|high|critical\",
                \"description\": \"Brief description\",
                \"line_number\": 42,
                \"suggestion\": \"What to do\",
                \"code_example\": \"Optional code example\"
              }}
            ],
            \"overall_score\": 85,
            \"summary\": \"Brief overall assessment\"
          }}
          '''

              try:
                  import requests
                  headers = {
                      'Authorization': f'Bearer {os.getenv(\"OPENAI_API_KEY\")}',
                      'Content-Type': 'application/json'
                  }
                  data = {
                      'model': model,
                      'messages': [{'role': 'user', 'content': prompt}],
                      'max_tokens': 1500,
                      'temperature': 0.2
                  }
                  response = requests.post('https://api.openai.com/v1/chat/completions', headers=headers, json=data)
                  if response.status_code == 200:
                      content = response.json()['choices'][0]['message']['content']
                      # Try to parse as JSON
                      try:
                          return json.loads(content)
                      except:
                          # Fallback to text parsing
                          return {'issues': [], 'overall_score': 75, 'summary': content[:500]}
                  else:
                      return {'issues': [], 'overall_score': 75, 'summary': f'Analysis failed: {response.status_code}'}
              except Exception as e:
                  return {'issues': [], 'overall_score': 75, 'summary': f'Analysis error: {e}'}

          # Get files to analyze
          files_to_analyze = '''${{ needs.analyze-code-quality.outputs.files_to_analyze }}'''.split('\n')
          files_to_analyze = [f for f in files_to_analyze if f.strip()]

          all_suggestions = {}

          for file_path in files_to_analyze[:5]:  # Limit to 5 files
              if file_path and Path(file_path).exists():
                  try:
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()

                      # Skip if file is too large
                      if len(content) > 50000:
                          continue

                      print(f'Analyzing {file_path}...')
                      suggestions = get_ai_refactoring_suggestions(content, file_path)

                      if suggestions.get('issues'):
                          all_suggestions[file_path] = suggestions

                  except Exception as e:
                      print(f'Error analyzing {file_path}: {e}')
                      continue

          # Save results
          with open('refactoring_suggestions.json', 'w') as f:
              json.dump(all_suggestions, f, indent=2)

          print(f'Analyzed {len(all_suggestions)} files for refactoring opportunities')
          "

      - name: Run static analysis tools
        run: |
          # Run basic static analysis
          echo "Running static analysis..."

          # For Java files
          find . -name "*.java" -type f | head -5 | while read file; do
            if command -v javac &> /dev/null; then
              echo "Checking $file..."
              # Basic syntax check
              javac -cp ".:*" "$file" 2>&1 | head -10 || true
            fi
          done

          # For Python files
          find . -name "*.py" -type f | head -5 | while read file; do
            if command -v python3 &> /dev/null; then
              echo "Checking $file..."
              python3 -m py_compile "$file" 2>&1 || true
            fi
          done

      - name: Post refactoring suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (fs.existsSync('refactoring_suggestions.json')) {
              const suggestions = JSON.parse(fs.readFileSync('refactoring_suggestions.json', 'utf8'));

              if (Object.keys(suggestions).length > 0) {
                let comment = '## 🔧 AI Code Refactoring Suggestions\n\n';
                comment += 'I analyzed the changed files and found the following refactoring opportunities:\n\n';

                for (const [filePath, analysis] of Object.entries(suggestions)) {
                  comment += `### 📁 ${filePath}\n\n`;
                  comment += `**Overall Score:** ${analysis.overall_score}/100\n\n`;
                  comment += `**Summary:** ${analysis.summary}\n\n`;

                  if (analysis.issues && analysis.issues.length > 0) {
                    comment += '**Issues Found:**\n\n';

                    for (const issue of analysis.issues.slice(0, 5)) {  // Limit to 5 issues per file
                      const severityEmoji = {
                        'low': 'ℹ️',
                        'medium': '⚠️',
                        'high': '🚨',
                        'critical': '💥'
                      }[issue.severity] || '❓';

                      comment += `${severityEmoji} **${issue.type.toUpperCase()}** (${issue.severity})\n`;
                      comment += `   - **Line ${issue.line_number}:** ${issue.description}\n`;
                      comment += `   - **Suggestion:** ${issue.suggestion}\n`;

                      if (issue.code_example) {
                        comment += `   - **Example:**\`\`\`\n${issue.code_example}\n\`\`\`\n`;
                      }

                      comment += '\n';
                    }

                    if (analysis.issues.length > 5) {
                      comment += `*... and ${analysis.issues.length - 5} more issues*\n\n`;
                    }
                  }

                  comment += '---\n\n';
                }

                comment += '**💡 Quick Wins:**\n';
                comment += '1. Address high-severity issues first\n';
                comment += '2. Consider breaking down complex methods\n';
                comment += '3. Look for duplicate code that can be extracted\n';
                comment += '4. Review naming conventions\n';
                comment += '5. Add missing documentation\n\n';

                comment += '*These suggestions are AI-generated. Review and test changes carefully.*';

                // Post comment
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }

  weekly-code-quality-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for reporting
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install reporting dependencies
        run: |
          pip install requests

      - name: Generate weekly code quality report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os
          import json
          import subprocess
          from datetime import datetime, timedelta

          def analyze_recent_commits():
              # Get commits from last week
              week_ago = (datetime.now() - timedelta(days=7)).strftime('%Y-%m-%d')
              result = subprocess.run(['git', 'log', f'--since={week_ago}', '--oneline'],
                                    capture_output=True, text=True, cwd='.')

              commits = result.stdout.strip().split('\n') if result.stdout.strip() else []
              return len(commits), commits[:10]

          def get_code_metrics():
              metrics = {}

              # Count files by type
              result = subprocess.run(['find', '.', '-name', '*.java', '-type', 'f'],
                                    capture_output=True, text=True, cwd='.')
              metrics['java_files'] = len(result.stdout.strip().split('\n')) if result.stdout.strip() else 0

              result = subprocess.run(['find', '.', '-name', '*.py', '-type', 'f'],
                                    capture_output=True, text=True, cwd='.')
              metrics['python_files'] = len(result.stdout.strip().split('\n')) if result.stdout.strip() else 0

              # Get basic stats
              result = subprocess.run(['find', '.', '-name', '*.java', '-o', '-name', '*.py',
                                     '-o', '-name', '*.js', '-o', '-name', '*.ts'],
                                    capture_output=True, text=True, cwd='.')
              code_files = result.stdout.strip().split('\n') if result.stdout.strip() else []
              metrics['total_code_files'] = len(code_files)

              # Calculate total lines of code (rough estimate)
              total_lines = 0
              for file_path in code_files[:50]:  # Sample first 50 files
                  if file_path and os.path.exists(file_path):
                      try:
                          with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                              total_lines += len(f.readlines())
                      except:
                          pass

              metrics['estimated_lines_of_code'] = total_lines * (len(code_files) / max(1, len(code_files[:50])))

              return metrics

          # Generate report
          commit_count, recent_commits = analyze_recent_commits()
          metrics = get_code_metrics()

          report = {
              'week_of': datetime.now().strftime('%Y-%m-%d'),
              'commit_count': commit_count,
              'recent_commits': recent_commits,
              'code_metrics': metrics,
              'recommendations': [
                  'Consider adding more unit tests if coverage is low',
                  'Review complex methods for potential refactoring',
                  'Update dependencies regularly',
                  'Add more documentation for new features',
                  'Consider performance profiling for slow endpoints'
              ]
          }

          with open('weekly_report.json', 'w') as f:
              json.dump(report, f, indent=2, default=str)

          print('Generated weekly code quality report')
          "

      - name: Create weekly quality issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (fs.existsSync('weekly_report.json')) {
              const report = JSON.parse(fs.readFileSync('weekly_report.json', 'utf8'));

              let body = '# 📊 Weekly Code Quality Report\n\n';
              body += `**Week of:** ${report.week_of}\n\n`;

              body += '## 📈 Activity Summary\n\n';
              body += `- **Commits this week:** ${report.commit_count}\n`;
              body += `- **Java files:** ${report.code_metrics.java_files}\n`;
              body += `- **Python files:** ${report.code_metrics.python_files}\n`;
              body += `- **Total code files:** ${report.code_metrics.total_code_files}\n`;
              body += `- **Estimated lines of code:** ${Math.round(report.code_metrics.estimated_lines_of_code)}\n\n`;

              if (report.recent_commits.length > 0) {
                body += '## 🔄 Recent Commits\n\n';
                for (const commit of report.recent_commits.slice(0, 5)) {
                  body += `- ${commit}\n`;
                }
                body += '\n';
              }

              body += '## 💡 Recommendations\n\n';
              for (const rec of report.recommendations) {
                body += `- ${rec}\n`;
              }
              body += '\n';

              body += '*This report is automatically generated. Review and address any issues identified.*';

              // Create issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Weekly Code Quality Report - ${report.week_of}`,
                body: body,
                labels: ['automated', 'code-quality', 'weekly-report']
              });
            }