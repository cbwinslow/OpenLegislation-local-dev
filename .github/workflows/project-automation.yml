            // Implementation would reorder items in project board
          }

  create-weekly-sprint-summary:
    name: Create Weekly Sprint Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Generate sprint summary
      uses: actions/github-script@v7
      with:
        script: |
          const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
          
          // Get issues closed this week
          const { data: closedIssues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'closed',
            since: oneWeekAgo
          });
          
          // Get PRs merged this week
          const { data: mergedPRs } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'closed',
            sort: 'updated',
            direction: 'desc'
          });
          
          const recentMerged = mergedPRs.filter(pr => 
            pr.merged_at && new Date(pr.merged_at) > new Date(oneWeekAgo)
          );
          
          // Create summary issue
          const summary = `# Weekly Sprint Summary
          
          **Week of ${new Date(oneWeekAgo).toLocaleDateString()} - ${new Date().toLocaleDateString()}**
          
          ## 📊 Metrics
          - **Issues Closed:** ${closedIssues.length}
          - **PRs Merged:** ${recentMerged.length}
          
          ## ✅ Completed Issues
          ${closedIssues.slice(0, 10).map(i => `- #${i.number}: ${i.title}`).join('\n')}
          
          ## 🔀 Merged Pull Requests  
          ${recentMerged.slice(0, 10).map(pr => `- #${pr.number}: ${pr.title}`).join('\n')}
          
          ## 📈 Next Week Focus
          - Review open high-priority issues
          - Continue federal data integration work
          - Address technical debt
          `;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Sprint Summary: ${new Date().toLocaleDateString()}`,
            body: summary,
            labels: ['sprint-summary', 'documentation']
          });
