name: Project Board Automation

on:
  issues:
    types: [opened, closed, reopened, assigned]
  pull_request:
    types: [opened, closed, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  update-project-status:
    name: Update Project Board Status
    runs-on: ubuntu-latest
    
    steps:
    - name: Update item status based on event
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { Octokit } = require("@octokit/rest");
          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
          
          // Function to move items in project board
          async function updateProjectItem(itemType, itemNumber, status) {
            console.log(`Updating ${itemType} #${itemNumber} to status: ${status}`);
            
            // This is a placeholder - actual implementation would require
            // GraphQL mutations to update Projects v2
            // See: https://docs.github.com/en/issues/planning-and-tracking-with-projects/automating-your-project/using-the-api-to-manage-projects
          }
          
          // Determine status based on event
          let status = 'Todo';
          if (context.eventName === 'issues') {
            if (context.payload.action === 'opened') {
              status = 'Todo';
            } else if (context.payload.action === 'assigned') {
              status = 'In Progress';
            } else if (context.payload.action === 'closed') {
              status = 'Done';
            } else if (context.payload.action === 'reopened') {
              status = 'In Progress';
            }
            
            await updateProjectItem('issue', context.payload.issue.number, status);
          } else if (context.eventName === 'pull_request') {
            if (context.payload.action === 'opened' || context.payload.action === 'ready_for_review') {
              status = 'In Review';
            } else if (context.payload.action === 'converted_to_draft') {
              status = 'In Progress';
            } else if (context.payload.action === 'closed') {
              status = context.payload.pull_request.merged ? 'Done' : 'Cancelled';
            }
            
            await updateProjectItem('pull_request', context.payload.pull_request.number, status);
          }

