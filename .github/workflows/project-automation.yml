  sync-issue-status:
    name: Sync Issue Status Comments
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    
    steps:
    - name: Add status comment
      uses: actions/github-script@v7
      with:
        script: |
          const itemNumber = context.payload.issue?.number || context.payload.pull_request?.number;
          const action = context.payload.action;
          
          let statusEmoji = '📝';
          let statusText = '';
          
          if (action === 'opened') {
            statusEmoji = '🆕';
            statusText = 'New item created';
          } else if (action === 'assigned') {
            statusEmoji = '👤';
            statusText = `Assigned to @${context.payload.assignee.login}`;
          } else if (action === 'closed') {
            statusEmoji = '✅';
            statusText = 'Completed';
          } else if (action === 'reopened') {
            statusEmoji = '🔄';
            statusText = 'Reopened for further work';
          }
          
          if (statusText) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: itemNumber,
              body: `${statusEmoji} **Status Update:** ${statusText}`
            });
          }

  organize-by-priority:
