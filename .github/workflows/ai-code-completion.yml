name: AI Code Completion & Enhancement

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
    paths:
      - '**/*.java'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-completion:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.java
            **/*.py
            **/*.js
            **/*.ts

      - name: Set up Python for AI analysis
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install AI analysis dependencies
        run: |
          pip install openai anthropic requests

      - name: Analyze code for completion opportunities
        id: ai-analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import os
          import json
          from pathlib import Path

          # Simple AI-powered code analysis script
          changed_files = '''${{ steps.changed-files.outputs.all_changed_files }}'''.split()

          suggestions = []

          for file_path in changed_files:
              if not file_path or not Path(file_path).exists():
                  continue

              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()

                  # Look for common incomplete patterns
                  incomplete_patterns = [
                      ('TODO', 'Found TODO comments that may need completion'),
                      ('FIXME', 'Found FIXME comments indicating incomplete code'),
                      ('NotImplementedError', 'Found NotImplementedError exceptions'),
                      ('pass', 'Found pass statements that may need implementation'),
                      ('# TODO', 'Found TODO comments'),
                      ('// TODO', 'Found TODO comments'),
                      ('raise NotImplementedError', 'Found unimplemented methods'),
                  ]

                  file_suggestions = []
                  lines = content.split('\n')

                  for i, line in enumerate(lines, 1):
                      for pattern, message in incomplete_patterns:
                          if pattern.lower() in line.lower():
                              file_suggestions.append({
                                  'line': i,
                                  'pattern': pattern,
                                  'message': message,
                                  'code': line.strip()
                              })

                  if file_suggestions:
                      suggestions.append({
                          'file': file_path,
                          'suggestions': file_suggestions[:5]  # Limit to 5 per file
                      })

              except Exception as e:
                  print(f'Error analyzing {file_path}: {e}')

          # Save suggestions to file
          with open('ai_suggestions.json', 'w') as f:
              json.dump(suggestions, f, indent=2)

          print(f'Found suggestions for {len(suggestions)} files')
          "

      - name: Generate AI completion suggestions
        id: ai-suggestions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import os
          import json
          import requests
          from pathlib import Path

          def get_ai_completion(prompt, model='gpt-3.5-turbo'):
              try:
                  headers = {
                      'Authorization': f'Bearer {os.getenv(\"OPENAI_API_KEY\")}',
                      'Content-Type': 'application/json'
                  }
                  data = {
                      'model': model,
                      'messages': [{'role': 'user', 'content': prompt}],
                      'max_tokens': 500,
                      'temperature': 0.7
                  }
                  response = requests.post('https://api.openai.com/v1/chat/completions', headers=headers, json=data)
                  if response.status_code == 200:
                      return response.json()['choices'][0]['message']['content']
                  else:
                      return f'Error: {response.status_code}'
              except:
                  return 'AI completion unavailable'

          # Load suggestions
          if Path('ai_suggestions.json').exists():
              with open('ai_suggestions.json', 'r') as f:
                  suggestions = json.load(f)

              enhanced_suggestions = []

              for file_sug in suggestions:
                  file_path = file_sug['file']
                  file_suggestions = []

                  for sug in file_sug['suggestions']:
                      # Get context around the line
                      try:
                          with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                              lines = f.readlines()
                              start = max(0, sug['line'] - 3)
                              end = min(len(lines), sug['line'] + 3)
                              context = ''.join(lines[start:end])

                          # Generate completion suggestion
                          prompt = f'''Analyze this code context and suggest a completion for the incomplete code at line {sug['line']}:

                          Context:
                          {context}

                          Issue: {sug['message']}
                          Code: {sug['code']}

                          Provide a specific code suggestion to complete this implementation. Focus on the immediate fix needed.'''

                          ai_suggestion = get_ai_completion(prompt)

                          file_suggestions.append({
                              **sug,
                              'ai_suggestion': ai_suggestion,
                              'context': context
                          })

                      except Exception as e:
                          file_suggestions.append({
                              **sug,
                              'ai_suggestion': f'Could not generate suggestion: {e}'
                          })

                  enhanced_suggestions.append({
                      'file': file_path,
                      'suggestions': file_suggestions
                  })

              # Save enhanced suggestions
              with open('enhanced_ai_suggestions.json', 'w') as f:
                  json.dump(enhanced_suggestions, f, indent=2)
          "

      - name: Post AI completion suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (fs.existsSync('enhanced_ai_suggestions.json')) {
              const suggestions = JSON.parse(fs.readFileSync('enhanced_ai_suggestions.json', 'utf8'));

              if (suggestions.length > 0) {
                let comment = '## 🤖 AI Code Completion Suggestions\n\n';
                comment += 'I found some areas in your code that might benefit from completion or enhancement:\n\n';

                for (const fileSug of suggestions) {
                  comment += `### 📁 \`${fileSug.file}\`\n\n`;

                  for (const sug of fileSug.suggestions) {
                    comment += `**Line ${sug.line}**: ${sug.message}\n`;
                    comment += '```' + getLanguageFromFile(fileSug.file) + '\n';
                    comment += sug.code + '\n';
                    comment += '```\n';

                    if (sug.ai_suggestion && !sug.ai_suggestion.startsWith('Could not')) {
                      comment += '**🤖 AI Suggestion:**\n';
                      comment += '<details><summary>View AI completion suggestion</summary>\n\n';
                      comment += '```\n' + sug.ai_suggestion + '\n```\n';
                      comment += '</details>\n\n';
                    } else {
                      comment += '*🤖 AI completion suggestion unavailable*\n\n';
                    }
                  }
                }

                comment += '\n---\n*These are AI-generated suggestions to help complete your code. Review and test before applying.*';

                // Post comment
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }

            function getLanguageFromFile(filename) {
              if (filename.endsWith('.java')) return 'java';
              if (filename.endsWith('.py')) return 'python';
              if (filename.endsWith('.js')) return 'javascript';
              if (filename.endsWith('.ts')) return 'typescript';
              return '';
            }

  ai-code-enhancement:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.java
            **/*.py
            **/*.js
            **/*.ts

      - name: Set up Python for enhancement analysis
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install enhancement dependencies
        run: |
          pip install openai anthropic requests

      - name: Generate code enhancement suggestions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          import os
          import json
          import requests
          from pathlib import Path

          def get_ai_enhancement(prompt, model='gpt-3.5-turbo'):
              try:
                  headers = {
                      'Authorization': f'Bearer {os.getenv(\"OPENAI_API_KEY\")}',
                      'Content-Type': 'application/json'
                  }
                  data = {
                      'model': model,
                      'messages': [{'role': 'user', 'content': prompt}],
                      'max_tokens': 300,
                      'temperature': 0.5
                  }
                  response = requests.post('https://api.openai.com/v1/chat/completions', headers=headers, json=data)
                  if response.status_code == 200:
                      return response.json()['choices'][0]['message']['content']
                  else:
                      return f'Error: {response.status_code}'
              except:
                  return 'Enhancement suggestion unavailable'

          # Analyze changed files for enhancement opportunities
          changed_files = '''${{ steps.changed-files.outputs.all_changed_files }}'''.split()
          enhancements = []

          for file_path in changed_files:
              if not file_path or not Path(file_path).exists():
                  continue

              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()

                  # Look for enhancement opportunities
                  enhancement_checks = [
                      ('public class', 'Consider adding JavaDoc documentation'),
                      ('public interface', 'Consider adding interface documentation'),
                      ('public method', 'Consider adding method documentation'),
                      ('catch (Exception', 'Consider more specific exception handling'),
                      ('System.out.println', 'Consider using proper logging instead'),
                      ('if (', 'Consider extracting complex conditions to variables'),
                      ('for (', 'Consider using streams or enhanced for-loops'),
                      ('null', 'Consider null safety improvements'),
                  ]

                  file_enhancements = []
                  lines = content.split('\n')

                  for i, line in enumerate(lines, 1):
                      for pattern, suggestion in enhancement_checks:
                          if pattern in line and len(line.strip()) < 200:  # Avoid very long lines
                              # Get context
                              start = max(0, i - 2)
                              end = min(len(lines), i + 3)
                              context = ''.join(lines[start:end])

                              # Generate specific enhancement
                              prompt = f'''Suggest a specific code enhancement for this code:

                              Context around line {i}:
                              {context}

                              General suggestion: {suggestion}

                              Provide a concrete, actionable improvement. Keep it brief.'''

                              ai_enhancement = get_ai_enhancement(prompt)

                              file_enhancements.append({
                                  'line': i,
                                  'pattern': pattern,
                                  'general_suggestion': suggestion,
                                  'ai_enhancement': ai_enhancement,
                                  'code': line.strip(),
                                  'context': context
                              })
                              break  # Only one enhancement per line

                  # Limit to top 3 enhancements per file
                  if file_enhancements:
                      enhancements.append({
                          'file': file_path,
                          'enhancements': file_enhancements[:3]
                      })

              except Exception as e:
                  print(f'Error analyzing {file_path}: {e}')

          # Save enhancements
          with open('code_enhancements.json', 'w') as f:
              json.dump(enhancements, f, indent=2)

          print(f'Generated enhancements for {len(enhancements)} files')
          "

      - name: Post code enhancement suggestions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (fs.existsSync('code_enhancements.json')) {
              const enhancements = JSON.parse(fs.readFileSync('code_enhancements.json', 'utf8'));

              if (enhancements.length > 0) {
                let comment = '## 🚀 AI Code Enhancement Suggestions\n\n';
                comment += 'Here are some suggestions to improve your code quality and maintainability:\n\n';

                for (const fileEnh of enhancements) {
                  comment += `### 📁 \`${fileEnh.file}\`\n\n`;

                  for (const enh of fileEnh.enhancements) {
                    comment += `**Line ${enh.line}**: ${enh.general_suggestion}\n`;
                    comment += '```' + getLanguageFromFile(fileEnh.file) + '\n';
                    comment += enh.code + '\n';
                    comment += '```\n';

                    if (enh.ai_enhancement && !enh.ai_enhancement.startsWith('Enhancement')) {
                      comment += '**🚀 AI Enhancement:**\n';
                      comment += '<details><summary>View specific improvement suggestion</summary>\n\n';
                      comment += enh.ai_enhancement + '\n';
                      comment += '</details>\n\n';
                    }
                  }
                }

                comment += '\n---\n*These are AI-generated suggestions for code improvements. Consider them as optional enhancements.*';

                // Post comment
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }

            function getLanguageFromFile(filename) {
              if (filename.endsWith('.java')) return 'java';
              if (filename.endsWith('.py')) return 'python';
              if (filename.endsWith('.js')) return 'javascript';
              if (filename.endsWith('.ts')) return 'typescript';
              return '';
            }