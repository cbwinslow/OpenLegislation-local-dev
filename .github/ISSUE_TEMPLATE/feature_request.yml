name: Feature Request
description: Suggest a new feature or enhancement for OpenLegislation
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible to help us understand your proposal.

  - type: textarea
    id: feature-summary
    attributes:
      label: Feature Summary
      description: A brief description of the proposed feature
      placeholder: Summarize your feature request...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What pain points does it address?
      placeholder: Describe the problem this feature would solve...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution in detail
      placeholder: Explain how this feature would work...
    validations:
      required: true

  - type: textarea
    id: alternative-solutions
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions you've considered
      placeholder: What other approaches have you thought about?
    validations:
      required: false

  - type: checkboxes
    id: affected-components
    attributes:
      label: Affected Components
      description: Which components would this feature affect?
      options:
        - label: API
        - label: Database
        - label: Frontend
        - label: Processing Pipeline
        - label: Documentation
        - label: Other
    validations:
      required: true

  - type: dropdown
    id: data-sources
    attributes:
      label: Data Sources
      description: Which data sources would be affected?
      options:
        - State
        - Federal
        - Both
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: breaking-changes
    attributes:
      label: Breaking Changes
      description: Would this feature introduce breaking changes?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: migration-required
    attributes:
      label: Migration Required
      description: Would this feature require data or schema migration?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: Provide user stories to illustrate how this feature would be used
      placeholder: |
        - As a [user type], I want [goal] so that [benefit]
        - As a [user type], I want [goal] so that [benefit]
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What criteria must be met for this feature to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: false

  - type: dropdown
    id: performance-impact
    attributes:
      label: Performance Impact
      description: What level of performance impact would this feature have?
      options:
        - None
        - Low
        - Medium
        - High
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: security-implications
    attributes:
      label: Security Implications
      description: Does this feature have security implications?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true

  - type: textarea
    id: database-changes
    attributes:
      label: Database Changes
      description: Describe any database changes (new tables, columns, modifications)
      placeholder: List database schema changes...
    validations:
      required: false

  - type: textarea
    id: api-changes
    attributes:
      label: API Changes
      description: Describe any API changes (new endpoints, modifications)
      placeholder: List API changes...
    validations:
      required: false

  - type: textarea
    id: external-dependencies
    attributes:
      label: External Dependencies
      description: List any new libraries, APIs, or external dependencies
      placeholder: List external dependencies...
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: How urgent is this feature?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: business-value
    attributes:
      label: Business Value
      description: What is the business value of this feature?
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: effort-estimate
    attributes:
      label: Effort Estimate
      description: Estimated effort to implement this feature
      options:
        - Small
        - Medium
        - Large
        - XL
        - Unknown
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request
      placeholder: Any additional information...
    validations:
      required: false
